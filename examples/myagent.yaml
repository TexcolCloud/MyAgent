server:
  host: 127.0.0.1
  port: 8787
  bearerToken:
    fromEnvironment: MYAGENT_BEARER_TOKEN
database:
  path: ./data/kernel.db
agentRoots:
  - ./agents
skillRoots:
  - ./skills
models:
  default:
    provider: openai-compatible
    model: gpt-4.1-mini
    baseUrl: https://api.openai.com/v1
    apiKey:
      fromEnvironment: OPENAI_API_KEY
    maxInputTokens: 32768
toolEnvironmentAllowlist:
  - PATH
